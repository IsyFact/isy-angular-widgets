# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches:
      - main
      - develop
      - develop/**
      - develop-*
      - support/**
      - release/**
  pull_request:
    branches:
      - main
      - develop
      - develop/**
      - develop-*
      - support/**
      - release/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Validate CHANGELOG on release branches
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          FIRST_CHANGELOG_LINE=$(head -n 1 CHANGELOG.md)
          if [[ "$FIRST_CHANGELOG_LINE" =~ ^\#[[:space:]]${VERSION//./\\.}.* ]]; then
            echo "First changelog entry describes current release version $VERSION"
          else
            echo "First changelog entry does not describe current release version $VERSION."
            exit 1
          fi
      - name: Bootstrap install (build local package)
        run: |
          npm ci --ignore-scripts
          git checkout package.json
      - name: Build local package
        run: |
          npm run build:widgets_lib
          npm run pack:widgets_lib
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check code formatting
        run: |
          npm run prettier:check
      - name: Lint library
        run: npm run lint:lib
      - name: Lint demo
        run: npm run lint:demo
      - name: Run tests
        run: npm test
      - name: Build demo application
        run: npm run build:widgets_demo
      - name: Build documentation (Compodoc)
        run: npm run compodoc:build
      - name: Generate SBOM (smoke test)
        continue-on-error: true
        run: |
          if npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file /tmp/sbom-smoke.json 2>/tmp/sbom-smoke.err; then
            echo "SBOM generated successfully."
          elif test -s /tmp/sbom-smoke.json; then
            echo "SBOM generated successfully (npm-ls diagnostics ignored)."
          else
            echo "SBOM generation failed. npm output:"
            cat /tmp/sbom-smoke.err
            exit 1
          fi
      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Perform SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/**/lcov.info
            -Dsonar.coverage.exclusions=**/main.ts,**/polyfills.ts,**/environment*.ts,**/environments/**,**/*.module.ts,**/test.ts,**/karma.conf.js,**/eslint.config.js,**/schematics/**,**/test/**,tools/generate-browser-support.mjs

  # Note: The GitHub Pages deployment covers BOTH version lines and runs
  # centrally from the `develop` branch. That workflow checks this branch out
  # via cross checkout and publishes it under `/v21/` as part of a single Pages
  # artifact, so there is exactly one artifact and one deploy job.
  #
  # Do not add a build_and_deploy_demo_and_docs job here: the environment
  # protection rules do not permit deploying github-pages from this branch, and
  # a second deploy job would race against the central one.
  #
  # The job below does not deploy. It only asks the workflow on `develop` to
  # run, so that changes on this branch reach the published site without any
  # manual step.
  trigger_pages_deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop-21' }}
    needs: [build_and_test]
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Trigger demo and documentation deployment on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run node.js.yml --ref develop
