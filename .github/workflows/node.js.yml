# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches:
      - main
      - develop
      - develop/**
      - develop-*
      - support/**
      - release/**
  pull_request:
    branches:
      - main
      - develop
      - develop/**
      - develop-*
      - support/**
      - release/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Stale pull request runs are superseded by the newest push. Runs on branches
# always run to completion so that the deployment trigger below is never lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changelog:
    name: Validate CHANGELOG
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate CHANGELOG on release branches
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          FIRST_CHANGELOG_LINE=$(head -n 1 CHANGELOG.md)
          if [[ "$FIRST_CHANGELOG_LINE" =~ ^\#[[:space:]]${VERSION//./\\.}.* ]]; then
            echo "First changelog entry describes current release version $VERSION"
          else
            echo "First changelog entry does not describe current release version $VERSION."
            exit 1
          fi

  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check code formatting
            command: npm run prettier:check
          - name: Lint library
            command: npm run lint:lib
          - name: Lint demo
            command: npm run lint:demo
          - name: Build documentation (Compodoc)
            command: npm run compodoc:build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [isy-angular-widgets, isy-angular-widgets-demo]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Run tests
        run: npx ng test ${{ matrix.project }} --watch=false
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: coverage/
          retention-days: 1

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud needs the full history to attribute issues to the
          # correct commits and to compute the new code period.
          fetch-depth: 0
      # The dependencies are required so that the scanner can resolve the
      # TypeScript program and keep the type aware rules effective.
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage
      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Perform SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=docs/**/*.html,docs/**/*.js,docs/**/*.css
            -Dsonar.javascript.lcov.reportPaths=coverage/**/lcov.info
            -Dsonar.coverage.exclusions=**/main.ts,**/polyfills.ts,**/environment*.ts,**/environments/**,**/*.module.ts,**/test.ts,**/karma.conf.js,**/eslint.config.js,**/schematics/**,**/test/**,tools/generate-browser-support.mjs

  package:
    name: Package library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Build local package
        run: |
          npm run build:widgets_lib
          npm run pack:widgets_lib
      - name: Install packed library
        run: |
          shopt -s nullglob
          TARBALLS=(dist/isy-angular-widgets/*.tgz)
          if [[ ${#TARBALLS[@]} -ne 1 ]]; then
            echo "Expected exactly one packed tarball, found ${#TARBALLS[@]}: ${TARBALLS[*]}"
            exit 1
          fi
          npm install --no-save --no-package-lock --ignore-scripts "${TARBALLS[0]}"
      - name: Verify manifests are untouched
        run: git diff --exit-code package.json package-lock.json
      - name: Generate SBOM (smoke test)
        continue-on-error: true
        run: |
          if npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file /tmp/sbom-smoke.json 2>/tmp/sbom-smoke.err; then
            echo "SBOM generated successfully."
          elif test -s /tmp/sbom-smoke.json; then
            echo "SBOM generated successfully (npm-ls diagnostics ignored)."
          else
            echo "SBOM generation failed. npm output:"
            cat /tmp/sbom-smoke.err
            exit 1
          fi

  demo_build:
    name: Build demo application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Build demo application
        run: npm run build:widgets_demo

  # Note: The GitHub Pages deployment covers BOTH version lines and runs
  # centrally from the `develop` branch. That workflow checks this branch out
  # via cross checkout and publishes it under `/v21/` as part of a single Pages
  # artifact, so there is exactly one artifact and one deploy job.
  #
  # Do not add a build_and_deploy_demo_and_docs job here: the environment
  # protection rules do not permit deploying github-pages from this branch, and
  # a second deploy job would race against the central one.
  #
  # The job below does not deploy. It only asks the workflow on `develop` to
  # run, so that changes on this branch reach the published site without any
  # manual step.
  trigger_pages_deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop-21' }}
    needs: [quality, test, sonar, package, demo_build]
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Trigger demo and documentation deployment on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run node.js.yml --ref develop
