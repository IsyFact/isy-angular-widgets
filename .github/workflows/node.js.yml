# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches:
      - main
      - develop
      - develop/**
      - develop-*
      - support/**
      - release/**
  pull_request:
    branches:
      - main
      - develop
      - develop/**
      - develop-*
      - support/**
      - release/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Stale pull request runs are superseded by the newest push. Runs on branches
# (and therefore every deployment) always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changelog:
    name: Validate CHANGELOG
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate CHANGELOG on release branches
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          FIRST_CHANGELOG_LINE=$(head -n 1 CHANGELOG.md)
          if [[ "$FIRST_CHANGELOG_LINE" =~ ^\#[[:space:]]${VERSION//./\\.}.* ]]; then
            echo "First changelog entry describes current release version $VERSION"
          else
            echo "First changelog entry does not describe current release version $VERSION."
            exit 1
          fi

  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check code formatting
            command: npm run prettier:check
          - name: Lint library
            command: npm run lint:lib
          - name: Lint demo
            command: npm run lint:demo
          - name: Build documentation (Compodoc)
            command: npm run compodoc:build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [isy-angular-widgets, isy-angular-widgets-demo]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Run tests
        run: npx ng test ${{ matrix.project }} --watch=false
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: coverage/
          retention-days: 1

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud needs the full history to attribute issues to the
          # correct commits and to compute the new code period.
          fetch-depth: 0
      # The dependencies are required so that the scanner can resolve the
      # TypeScript program and keep the type aware rules effective.
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage
      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Perform SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=docs/**/*.html,docs/**/*.js,docs/**/*.css
            -Dsonar.javascript.lcov.reportPaths=coverage/**/lcov.info
            -Dsonar.coverage.exclusions=**/main.ts,**/polyfills.ts,**/environment*.ts,**/environments/**,**/*.module.ts,**/test.ts,**/karma.conf.js,**/eslint.config.js,**/schematics/**,**/test/**,tools/generate-browser-support.mjs,tools/pages-spa-fallback.mjs

  package:
    name: Package library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Build local package
        run: |
          npm run build:widgets_lib
          npm run pack:widgets_lib
      - name: Install packed library
        run: |
          shopt -s nullglob
          TARBALLS=(dist/isy-angular-widgets/*.tgz)
          if [[ ${#TARBALLS[@]} -ne 1 ]]; then
            echo "Expected exactly one packed tarball, found ${#TARBALLS[@]}: ${TARBALLS[*]}"
            exit 1
          fi
          npm install --no-save --no-package-lock --ignore-scripts "${TARBALLS[0]}"
      - name: Verify manifests are untouched
        run: git diff --exit-code package.json package-lock.json
      - name: Generate SBOM (smoke test)
        continue-on-error: true
        run: |
          if npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file /tmp/sbom-smoke.json 2>/tmp/sbom-smoke.err; then
            echo "SBOM generated successfully."
          elif test -s /tmp/sbom-smoke.json; then
            echo "SBOM generated successfully (npm-ls diagnostics ignored)."
          else
            echo "SBOM generation failed. npm output:"
            cat /tmp/sbom-smoke.err
            exit 1
          fi

  demo_build:
    name: Build demo application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
      - name: Build demo application
        run: npm run build:widgets_demo
      - name: Verify demo build output layout
        run: |
          if [ ! -f dist/isy-angular-widgets-demo/browser/index.html ]; then
            echo "Expected dist/isy-angular-widgets-demo/browser/index.html to exist after demo build."
            echo "The Angular application builder output layout may have changed; update the deploy job accordingly."
            ls -R dist/isy-angular-widgets-demo || true
            exit 1
          fi

  build_and_deploy_demo_and_docs:
    # Reacts to workflow_dispatch as well, so that a push on develop-21 can
    # trigger a redeploy of both version lines from here.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' }}

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [quality, test, sonar, package, demo_build]
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout current line (v22)
        uses: actions/checkout@v4
      - name: Checkout legacy line (v21)
        uses: actions/checkout@v4
        with:
          ref: develop-21
          path: src-v21
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Build current line (v22) into the site root
        run: tools/build-pages-variant.sh . site "${{ steps.pages.outputs.base_path }}/"
      - name: Build legacy line (v21) into /v21
        run: tools/build-pages-variant.sh src-v21 site/v21 "${{ steps.pages.outputs.base_path }}/v21/"
      - name: Generate SPA fallback
        run: node tools/pages-spa-fallback.mjs site "${{ steps.pages.outputs.base_path }}" v21
      - name: Verify site layout
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          FAILED=0
          check_base_href() {
            if ! grep -qF "<base href=\"$2\"" "$1"; then
              echo "Expected base href '$2' in $1, found: $(grep -o '<base[^>]*>' "$1" || echo none)"
              FAILED=1
            fi
          }
          check_exists() {
            if [[ ! -f "$1" ]]; then
              echo "Expected $1 to exist."
              FAILED=1
            fi
          }
          check_base_href site/index.html "$BASE_PATH/"
          check_base_href site/v21/index.html "$BASE_PATH/v21/"
          check_exists site/404.html
          check_exists site/documentation/index.html
          check_exists site/v21/documentation/index.html
          # GitHub Pages only ever serves the 404.html at the root of the site.
          if [[ -f site/v21/404.html ]]; then
            echo "site/v21/404.html is ignored by GitHub Pages and must not be created."
            FAILED=1
          fi
          exit $FAILED
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - name: Deploy demo and documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Display deployment URLs
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Demo (v22):          ${PAGE_URL}"
          echo "Documentation (v22): ${PAGE_URL}documentation/"
          echo "Demo (v21):          ${PAGE_URL}v21/"
          echo "Documentation (v21): ${PAGE_URL}v21/documentation/"
