<div class="flex flex-column p-3">
  <h1>PrimeNG Buttons</h1>
  <demo-section-heading
    anchorId="colored-buttons"
    [level]="2"
    label="Colored Buttons"
    ariaLabel="Link zu Colored Buttons"
  />
  <div class="grid">
    <div class="col-12">
      <div class="flex flex-column gap-2">
        <div class="grid align-items-center">
          <span class="col-4">Primary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Primary" />
            <p-button label="Primary" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Secondary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Secondary" severity="secondary" />
            <p-button label="Secondary" severity="secondary" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Success</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Success" severity="success" />
            <p-button label="Success" severity="success" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Info</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Info" severity="info" />
            <p-button label="Info" severity="info" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Warning</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Warning" severity="warn" />
            <p-button label="Warning" severity="warn" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Help</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Help" severity="help" />
            <p-button label="Help" severity="help" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Danger</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Danger" severity="danger" />
            <p-button label="Danger" severity="danger" [disabled]="true" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <p-divider />
  <demo-section-heading
    anchorId="outlined-buttons"
    [level]="2"
    label="Outlined Buttons"
    ariaLabel="Link zu Outlined Buttons"
  />
  <div class="grid">
    <div class="col-12">
      <div class="flex flex-column gap-2">
        <div class="grid align-items-center">
          <span class="col-4">Primary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Primary" [outlined]="true" />
            <p-button label="Primary" [outlined]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Secondary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Secondary" [outlined]="true" severity="secondary" />
            <p-button label="Secondary" [outlined]="true" severity="secondary" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Success</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Success" [outlined]="true" severity="success" />
            <p-button label="Success" [outlined]="true" severity="success" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Info</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Info" [outlined]="true" severity="info" />
            <p-button label="Info" [outlined]="true" severity="info" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Warning</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Warning" [outlined]="true" severity="warn" />
            <p-button label="Warning" [outlined]="true" severity="warn" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Help</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Help" [outlined]="true" severity="help" />
            <p-button label="Help" [outlined]="true" severity="help" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Danger</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Danger" [outlined]="true" severity="danger" />
            <p-button label="Danger" [outlined]="true" severity="danger" [disabled]="true" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <p-divider />
  <demo-section-heading anchorId="text-buttons" [level]="2" label="Text Buttons" ariaLabel="Link zu Text Buttons" />
  <div class="grid">
    <div class="col-12">
      <div class="flex flex-column gap-2">
        <div class="grid align-items-center">
          <span class="col-4">Primary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Primary" [text]="true" />
            <p-button label="Primary" [text]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Secondary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Secondary" [text]="true" severity="secondary" />
            <p-button label="Secondary" [text]="true" severity="secondary" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Danger</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button label="Danger" [text]="true" severity="danger" />
            <p-button label="Danger" [text]="true" severity="danger" [disabled]="true" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <p-divider />
  <demo-section-heading anchorId="icon-buttons" [level]="2" label="Icon Buttons" ariaLabel="Link zu Icon Buttons" />
  <div class="grid">
    <div class="col-12">
      <div class="flex flex-column gap-2">
        <div class="grid align-items-center">
          <span class="col-4">Primary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button icon="pi pi-check" [rounded]="true" [outlined]="true" />
            <p-button icon="pi pi-check" [rounded]="true" [outlined]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Secondary</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button icon="pi pi-bookmark" [rounded]="true" severity="secondary" [outlined]="true" />
            <p-button icon="pi pi-bookmark" [rounded]="true" severity="secondary" [outlined]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Success</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button icon="pi pi-search" [rounded]="true" severity="success" [outlined]="true" />
            <p-button icon="pi pi-search" [rounded]="true" severity="success" [outlined]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Info</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button icon="pi pi-user" [rounded]="true" severity="info" [outlined]="true" />
            <p-button icon="pi pi-user" [rounded]="true" severity="info" [outlined]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Warning</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button icon="pi pi-bell" [rounded]="true" severity="warn" [outlined]="true" />
            <p-button icon="pi pi-bell" [rounded]="true" severity="warn" [outlined]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Help</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button icon="pi pi-heart" [rounded]="true" severity="help" [outlined]="true" />
            <p-button icon="pi pi-heart" [rounded]="true" severity="help" [outlined]="true" [disabled]="true" />
          </div>
        </div>
        <div class="grid align-items-center">
          <span class="col-4">Danger</span>
          <div class="col-8 flex gap-3 flex-wrap">
            <p-button icon="pi pi-times" [rounded]="true" severity="danger" [outlined]="true" />
            <p-button icon="pi pi-times" [rounded]="true" severity="danger" [outlined]="true" [disabled]="true" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <p-divider />
  <h2>Special Buttons</h2>
  <div class="grid mb-3">
    <div class="col-12 flex flex-column gap-2">
      <demo-section-heading anchorId="splitbutton" [level]="3" label="SplitButton" ariaLabel="Link zu SplitButton" />
      <p-splitbutton label="Save" icon="pi pi-save" [model]="options" />
    </div>
    <div class="col-12 flex flex-column gap-2">
      <demo-section-heading anchorId="speeddial" [level]="3" label="SpeedDial" ariaLabel="Link zu SpeedDial" />
      <p-speeddial id="speedDial" [model]="options" direction="right" />
    </div>
  </div>
</div>
