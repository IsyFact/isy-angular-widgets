<p-inputmask
  [readonly]="readonly"
  [disabled]="disabled"
  (inputChange)="onInputChange($event)"
  (onBlur)="onBlur()"
  (onComplete)="onComplete()"
  (onKeydown)="onKeydown($event)"
  mask="**.**.****"
  [ngModel]="inputValue"
  (ngModelChange)="onModelChange($event)"
  [ngModelOptions]="{standalone: true}"
  characterPattern="^[x]"
  [placeholder]="placeholder"
  [inputId]="inputId!"
  [autoClear]="false"
  styleClass="w-full"
  [invalid]="isInvalid"
  [required]="isRequired"
  [ariaRequired]="isRequired"
/>
